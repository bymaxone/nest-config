# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (install, lint, typecheck, unit+coverage, mutation) run
# via node-lib-ci.yml. This library's extra verification (build output integrity
# across both subpaths, bundle-size budget) and its e2e suite against the built
# package stay here. Mutation runs only on a push to main / manual dispatch,
# never on PRs.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-build: false # build + integrity + size verified in the `verify` job below
      unit-command: pnpm test:cov:all
      run-mutation: true
      mutation-source-globs: '^(src/)'
      # The per-push run is incremental and finishes in minutes; this ceiling exists for the
      # cold one — the first run after enabling incremental, and any run whose baseline cache
      # expired. Measured cold: 6 min. The job is CANCELLED rather than failed when it
      # lands, which reads as an infrastructure blip instead of a budget.
      mutation-timeout-minutes: 45

  # Library-specific verification: full build, output integrity across every
  # declared subpath, and the brotli bundle-size budget.
  verify:
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install step below runs the pull request's own scripts; the read-only token must
          # not stay in the repository's git configuration for them to read.
          persist-credentials: false
          # The length check compares a pull request's baseline with its base branch's.
          fetch-depth: 0
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Mutation directives parse and carry their reason
        run: pnpm check:mutants
      - name: Source files stay within the length limit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A pull request is also checked against the baseline on its base branch, so the
          # baseline it carries cannot admit the offender it adds.
          if [ -n "$BASE_REF" ]; then
            pnpm check:file-length --base "origin/$BASE_REF"
          else
            pnpm check:file-length
          fi
      - name: Functions and test bodies stay within the length limit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Compared with the base branch's baseline for the same reason as the length check above.
          if [ -n "$BASE_REF" ]; then
            pnpm check:function-length --base "origin/$BASE_REF"
          else
            pnpm check:function-length
          fi
      - name: No double assertions beyond the frozen baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Compared with the base branch's baseline so the one it carries cannot admit a new site.
          if [ -n "$BASE_REF" ]; then
            pnpm check:double-assertions --base "origin/$BASE_REF"
          else
            pnpm check:double-assertions
          fi
      - name: Spec files open with a purpose and layer header
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            pnpm check:spec-headers --base "origin/$BASE_REF"
          else
            pnpm check:spec-headers
          fi
      - name: Import-graph rules can see the module graph
        # A graph rule resolves a dependency and then parses it separately, and
        # it skips in silence any extension it cannot map to a parser. So the
        # rule reports nothing on a TypeScript project while `--print-config`
        # still shows it enabled -- which is how a cycle gate stays green on a
        # real cycle. This makes one and requires the lint to reject it.
        run: pnpm check:lint-graph
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        # Confirms every declared subpath produced both ESM and CJS bundles plus
        # type declarations. A missing artifact here indicates a tsup
        # misconfiguration that would ship a broken package to npm.
        run: |
          for subpath in index internal/index testing/index; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath.$ext" ]; then
                echo "Missing dist/$subpath.$ext"
                exit 1
              fi
            done
          done
          echo "Every entry point produced ESM + CJS + .d.ts + .d.cts"
      - name: Verify published type resolution
        # A source-level typecheck compiles `src`, so it cannot catch a broken
        # `exports` map: a consumer resolving through the packed tarball may still
        # land on declarations for the wrong module format. `attw` packs the
        # tarball and resolves every entry point the way each resolution mode does.
        run: pnpm check:exports
      - name: Published surface (README, CHANGELOG, exported types)
        # Compiles every README snippet against the types a consumer resolves through `dist/`,
        # checks the README links and anchors, and requires a CHANGELOG section for each released
        # version, so a README defect fails on the pull request instead of inside the release build.
        # It reads `dist/`, so it runs after the build, and it lists the git tags, which the full
        # history fetched above provides.
        run: pnpm check:published
      - name: Consumer runtime
        # The only gate that boots NestJS against the packed tarball, in ESM and
        # in CommonJS. Entry points are separate bundles, so a module both reach
        # by a relative path is copied into each, and a copied class is a
        # different injection token — invisible to every source-based gate.
        run: pnpm check:runtime
      - name: Bundle size budget
        run: pnpm size

  e2e:
    name: E2E (built package)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install step below runs the pull request's own scripts; the read-only token must
          # not stay in the repository's git configuration for them to read.
          persist-credentials: false
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Build all subpaths
        # The e2e suite resolves through dist/, never src/ aliases, so it proves
        # the shipped bundle rather than the source tree.
        run: pnpm build
      - name: End-to-end tests against the built package
        run: pnpm test:e2e

  security:
    # Dependency review needs the dependency graph: a public repository, or a private one with a
    # paid licence, which is not purchased.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: low

  # Single check the org ruleset can require, in every repo, under one name.
  #
  # A required status check is matched by literal name, and this repo's jobs are
  # named nothing like the next repo's — so there is no list of contexts that
  # works org-wide. One aggregate per repo, always spelled `CI passed`, is what
  # makes a single rule at the organisation level possible, and what makes every
  # repository created from now on inherit the gate without being configured.
  #
  # `always()` is what makes this a gate rather than decoration: without it the
  # job is skipped the moment a dependency fails, and a skipped job reports
  # success to a required check — the pull request would look unblocked precisely
  # when it is broken.
  #
  # For the same reason every job that runs on every event has to be `success`
  # here: a `cancelled` one, which a queue timeout produces, is not a pass, and
  # `skipped` is allowed only for `security`, which carries an `if`.
  ci-pass:
    name: CI passed
    if: always()
    needs: [ci, verify, e2e, security]
    runs-on: ubuntu-latest
    # Once this is the required check, a hung runner holds every merge behind it
    # for GitHub's default of six hours. The job is one comparison, so a short
    # ceiling costs nothing and bounds that.
    timeout-minutes: 5
    steps:
      # Printed on success as well as failure. Without it the check reports a bare
      # red X and the reader has to open each dependency to find which one broke.
      - name: Report the result of every dependency
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail unless every dependency succeeded, or security was skipped
        if: >-
          needs.ci.result != 'success' ||
          needs.verify.result != 'success' ||
          needs.e2e.result != 'success' ||
          (needs.security.result != 'success' && needs.security.result != 'skipped')
        run: exit 1
