# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The rules that must not vary between Bymax repositories are
# edited there; everything this repository writes for itself lives outside the
# markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review, so a
# shared rule has to exist as a real file here rather than be referenced. That is
# why this is a sync and not a `uses:` — the reusable CI above it propagates by
# reference, this one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly, and the latest of this repository's Monday schedules: Scorecard
    # (04:00), the full mutation run (04:23), CodeQL (06:00) and the peer
    # advisory drift check (06:17) all start earlier, so the sync does not
    # compete with them for runners.
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # Named rather than `inherit`, so the called workflow receives these two
      # secrets and not every secret this repository holds.
      #
      # A pull request opened with the default GITHUB_TOKEN starts no workflow
      # runs — GitHub's anti-recursion guard, not a misconfiguration — so it
      # arrives with no checks at all rather than failing ones, and the
      # `nest-config-pr-and-ci-gates` ruleset requires eight. Such a pull request
      # can never merge while reading on screen as merely awaiting review.
      #
      # The App credentials avoid that without a long-lived credential to rotate:
      # the token is minted per run and expires within the hour. Both are
      # organisation secrets visible to every repository, and bymax-agents-sync
      # is installed org-wide, so this repository holds no secret of its own.
      #
      # Supply both or neither. The called workflow refuses a half-configured
      # pair rather than falling back, because a silent fallback there is
      # indistinguishable from having configured nothing.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
