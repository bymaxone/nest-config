# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  # Reached through jest-haste-map, which declares it under `dependencies` rather
  # than `optionalDependencies`, so it arrives with jest rather than being chosen
  # here.
  #
  # `false` is not the cautious half of a real choice, it is the only value that
  # does anything. The package's install script is `node scripts/build-from-source.js`,
  # whose body runs only when `npm_config_build_from_source === 'true'`, so under
  # an ordinary install it is a no-op and `true` would compile nothing. What
  # `false` buys is pnpm treating the package as reviewed instead of failing the
  # install with ERR_PNPM_IGNORED_BUILDS.
  #
  # So with that variable unset — every install this repository and its pipeline
  # perform — `false` and `true` are behaviourally identical, which is a stronger
  # statement than "denying is safer": there is no trade-off to weigh. The two
  # diverge only for someone who deliberately sets
  # `npm_config_build_from_source=true`, and denying that compile is the policy
  # this entry exists to state.
  #
  # The binding does not come from the build in either case. `index.js` resolves
  # `@parcel/watcher-${process.platform}-${process.arch}` first, one of twelve
  # prebuilt packages, and reaches `./build/Release/watcher.node` only if that
  # fails. On the twelve, requiring the module with no `build/` directory present
  # returns subscribe, unsubscribe, writeSnapshot and getEventsSince. On any other
  # target the require throws — under `true` as well, since the gated script
  # builds nothing there during an ordinary install.
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  # GHSA-5p4m-2wfm-xmqj (CVSS 7.5) — quadratic CPU while resolving !!omap.
  # Transitive and build-time only; patched rather than ignored, because a
  # scanner told to skip dev dependencies stays blind after this one is gone.
  'js-yaml@3': '^3.15.1'
  'js-yaml@4': '^4.3.1'
  'brace-expansion@1': '^1.1.17'
  'brace-expansion@2': '^2.1.3'
  'brace-expansion@5': '^5.0.8'
  'esbuild': '^0.28.1'
  'fast-uri': '^3.1.4'
  'protobufjs': '^7.6.5'
  'qs': '^6.15.2'
  # GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx (both CVSS 7.5) — reachable only
  # through Stryker's Babel instrumenter, so development-scoped and never in the
  # published package. Patched rather than ignored, on the same reasoning as the
  # entries above: an ignore entry is a standing exception a later reader has to
  # re-audit, while a floor stops applying the moment nothing resolves below it.
  # Nothing caps it — @babel/helper-compilation-targets asks for ^4.24.0 and
  # update-browserslist-db for >= 4.21.0.
  'browserslist': '^4.28.7'
