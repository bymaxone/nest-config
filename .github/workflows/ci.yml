name: CI

# Runs on every push to `main` and on every PR targeting `main`. The
# `workflow_dispatch` trigger is kept so the same job can be re-run manually
# from the Actions tab when needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository. No write scopes are granted so a
# compromised dependency in a workflow step cannot mutate the repo or its releases.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, lint, test, build, size)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Blocks PRs that introduce dependencies with known vulnerabilities or
      # license violations. PR-only, since on push to main there is no base ref
      # to diff against. Requires the repo's Dependency Graph to be enabled
      # (Settings, Code security, Dependency graph), which in turn requires
      # either a public repository or GitHub Advanced Security. This repository
      # stays private until it is ready to publish, so the step is non-blocking
      # until then: it activates as a real gate once the repository is public.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        # dependency-review-action needs the GitHub dependency graph, which on a
        # private repository requires GitHub Advanced Security. While private the
        # step is advisory (non-blocking); once the repo is public it becomes a
        # real gate that fails on high-severity advisories.
        continue-on-error: ${{ github.event.repository.private }}
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage (100% enforced)
        run: pnpm test:cov:all

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

      - name: Build all subpaths
        run: pnpm build

      - name: Verify build output integrity
        # Confirms every declared subpath produced both ESM and CJS bundles
        # plus type declarations. A missing artifact here indicates a tsup
        # misconfiguration that would ship a broken package to npm.
        run: |
          for ext in mjs cjs d.ts d.cts; do
            if [ ! -f "dist/index.$ext" ]; then
              echo "Missing dist/index.$ext"
              exit 1
            fi
            if [ ! -f "dist/testing/index.$ext" ]; then
              echo "Missing dist/testing/index.$ext"
              exit 1
            fi
          done
          echo "Both subpaths produced ESM + CJS + .d.ts + .d.cts"

      - name: Bundle size budget
        # Zero-dependency brotli-size gate over the built .mjs subpaths.
        # See scripts/check-size.mjs for budgets and rationale.
        run: pnpm size

      - name: E2E tests against the built package
        # Boots a realistic fixture application through the compiled dist/
        # artifacts (never src/ aliases). See jest.e2e.config.ts for the
        # resolution mechanism. Runs after the build step on purpose: it
        # proves the shipped bundle, not the source tree.
        run: pnpm test:e2e
