# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (install, lint, typecheck, unit+coverage, mutation) run
# via node-lib-ci.yml. This library's extra verification (build output integrity
# across both subpaths, bundle-size budget) and its e2e suite against the built
# package stay here. Mutation runs only on a push to main / manual dispatch,
# never on PRs.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-format-check: false # no format:check script; prettier runs via lint/pre-commit
      run-build: false # build + integrity + size verified in the `verify` job below
      unit-command: pnpm test:cov:all
      run-mutation: true
      mutation-source-globs: '^(src/)'

  # Library-specific verification: full build, output integrity across every
  # declared subpath, and the brotli bundle-size budget.
  verify:
    name: Verify build + size
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Mutation directives parse and carry their reason
        run: pnpm check:mutants
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        # Confirms every declared subpath produced both ESM and CJS bundles plus
        # type declarations. A missing artifact here indicates a tsup
        # misconfiguration that would ship a broken package to npm.
        run: |
          for subpath in index internal/index testing/index; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath.$ext" ]; then
                echo "Missing dist/$subpath.$ext"
                exit 1
              fi
            done
          done
          echo "Every entry point produced ESM + CJS + .d.ts + .d.cts"
      - name: Verify published type resolution
        # A source-level typecheck compiles `src`, so it cannot catch a broken
        # `exports` map: a consumer resolving through the packed tarball may still
        # land on declarations for the wrong module format. `attw` packs the
        # tarball and resolves every entry point the way each resolution mode does.
        run: pnpm check:exports
      - name: Consumer runtime
        # The only gate that boots NestJS against the packed tarball, in ESM and
        # in CommonJS. Entry points are separate bundles, so a module both reach
        # by a relative path is copied into each, and a copied class is a
        # different injection token — invisible to every source-based gate.
        run: pnpm check:runtime
      - name: Bundle size budget
        run: pnpm size

  e2e:
    name: E2E (built package)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Build all subpaths
        # The e2e suite resolves through dist/, never src/ aliases, so it proves
        # the shipped bundle rather than the source tree.
        run: pnpm build
      - name: End-to-end tests against the built package
        run: pnpm test:e2e

  security:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high
